{% extends "base.html" %}

{% block title %}Cadastrar{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Criar Nova Conta</h3>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="nome" name="nome" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha (mínimo 6 caracteres)</label>
                        <input type="password" class="form-control" id="senha" name="senha" minlength="6" required>
                    </div>

                    <!-- NOVO CAMPO: Tipo de Conta -->
                    <div class="mb-3">
                        <label for="tipo" class="form-label">Eu quero:</label>
                        <select class="form-select" id="tipo" name="tipo" required>
                            <option value="cliente" selected>Contratar serviços (Sou Cliente)</option>
                            <option value="prestador">Oferecer serviços (Sou Prestador)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success w-100 mt-3">Cadastrar</button>
                </form>

                <div class="text-center mt-3">
                    <small>Já tem uma conta? <a href="{{ url_for('auth.login') }}">Faça login</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
