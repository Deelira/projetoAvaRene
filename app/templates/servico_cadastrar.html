{% extends "base.html" %}

{% block title %}Cadastrar Serviço{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-7">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Cadastrar Novo Serviço</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('servico.cadastrar') }}">
                    
                    <div class="mb-3">
                        <label for="titulo" class="form-label">Título do Serviço</label>
                        <input type="text" class="form-control" id="titulo" name="titulo" placeholder="Ex: Conserto de torneira" required>
                    </div>

                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="3" placeholder="Detalhe o que está incluso no serviço..." required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="preco" class="form-label">Preço (R$)</label>
                        <!-- O step="0.01" permite centavos -->
                        <input type="number" step="0.01" min="0.01" class="form-control" id="preco" name="preco" placeholder="150.50" required>
                    </div>
                    
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('auth.dashboard') }}" class="btn btn-outline-secondary">Voltar</a>
                        <button type="submit" class="btn btn-success">Salvar Serviço</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
