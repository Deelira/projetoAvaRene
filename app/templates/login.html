{% extends "base.html" %}

{% block title %}Entrar{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Acessar Conta</h3>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <!-- O atributo name="email" é OBRIGATÓRIO para o Python ler -->
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <!-- O atributo name="senha" deve ser igual ao do auth.py -->
                        <input type="password" class="form-control" id="senha" name="senha" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-3">Entrar</button>
                </form>

                <div class="text-center mt-3">
                    <small>Não tem uma conta? <a href="{{ url_for('auth.register') }}">Cadastre-se aqui</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
